<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AskEva — Screenshot Export</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  background:#F6F8F5;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px 16px;
}
.card{
  background:#fff;
  border-radius:24px;
  border:1px solid #EEF1EC;
  box-shadow:0 4px 32px rgba(0,0,0,0.06);
  padding:36px 32px 32px;
  width:100%;
  max-width:460px;
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:22px;
}
.logo-icon{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,#2BA84A,#5BCC4A);
  display:grid;place-items:center;
}
.logo-icon svg{width:20px;height:20px;}
.logo-name{font-size:17px;font-weight:800;color:#15231A;letter-spacing:-.3px;}
h1{font-size:20px;font-weight:800;color:#15231A;margin-bottom:6px;line-height:1.2;}
.subtitle{font-size:13px;color:#4D5D52;margin-bottom:24px;line-height:1.55;}
.overall-status{
  font-size:12px;font-weight:600;color:#3CC23F;
  background:#EAF9E6;
  border-radius:8px;
  padding:8px 12px;
  margin-bottom:20px;
  letter-spacing:.2px;
  min-height:34px;
  display:flex;
  align-items:center;
}
.screen-list{
  list-style:none;
  margin-bottom:24px;
  border:1px solid #EEF1EC;
  border-radius:14px;
  overflow:hidden;
}
.screen-list li{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  font-size:13px;
  color:#4D5D52;
  border-bottom:1px solid #EEF1EC;
}
.screen-list li:last-child{border-bottom:none;}
.dot{
  width:9px;height:9px;border-radius:50%;
  background:#EEF1EC;
  flex-shrink:0;
  transition:background .25s,transform .2s;
}
.dot.active{background:#F5B829;transform:scale(1.2);}
.dot.done{background:#3CC23F;}
.dot.error{background:#EF5350;}
.screen-name{flex:1;}
.check{font-size:13px;color:#3CC23F;opacity:0;transition:opacity .25s;}
.done .check{opacity:1;}
.btn{
  width:100%;
  background:linear-gradient(135deg,#2BA84A,#5BCC4A);
  color:#fff;
  border:none;
  border-radius:14px;
  padding:15px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  font-family:inherit;
  letter-spacing:-.1px;
  transition:opacity .2s,transform .15s;
}
.btn:hover{opacity:.93;}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.note{font-size:11px;color:#8A978D;text-align:center;margin-top:14px;line-height:1.5;}

/* hidden iframe — off-screen but rendered */
#appFrame{
  position:fixed;
  left:-450px;
  top:0;
  width:390px;
  height:844px;
  border:none;
  pointer-events:none;
}
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <span class="logo-name">AskEva</span>
  </div>

  <h1>Screenshot Export</h1>
  <p class="subtitle">Captures all 12 app screens at 2× resolution and bundles them into a downloadable ZIP folder.</p>

  <div class="overall-status" id="overallStatus">Ready — click Start to begin</div>

  <ul class="screen-list" id="screenList"></ul>

  <button class="btn" id="startBtn" onclick="startCapture()">▶ Start Capture &amp; Download ZIP</button>
  <p class="note">Keep this tab in the foreground while capturing. Takes ~20 seconds.</p>
</div>

<!-- App loads here, off screen -->
<iframe id="appFrame" src="AskEva App - MASTER.html"></iframe>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
var SCREENS = [
  { name:'01 - Splash Screen',        nav: navSplash() },
  { name:'02 - Login',                nav: navLogin() },
  { name:'03 - Home Dashboard',       nav: navPane('app-home') },
  { name:'04 - Analytics Dashboard',  nav: navPane('app-dashboard') },
  { name:'05 - Leads',                nav: navPane('app-leads') },
  { name:'06 - Contacts',             nav: navPane('app-contacts') },
  { name:'07 - Appointments',         nav: navPane('app-appointments') },
  { name:'08 - Ticketing',            nav: navPane('app-ticketing') },
  { name:'09 - Compose Message',      nav: navPane('app-compose') },
  { name:'10 - Settings',             nav: navPane('app-settings') },
  { name:'11 - Profile',              nav: navPane('app-profile') },
  { name:'12 - Lead Settings',        nav: navPane('app-leadsettings') },
  { name:'13 - Chat List',            nav: navChat('listView') },
  { name:'14 - Conversation',         nav: navChat('convView') },
];

function navSplash() {
  return `
    var sp=document.getElementById('splashScreen');
    var lg=document.getElementById('loginScreen');
    if(sp){sp.style.cssText='display:flex!important;opacity:1!important;';}
    if(lg){lg.style.display='none';}
    document.querySelectorAll('.app-pane').forEach(function(p){p.classList.remove('active');});
  `;
}
function navLogin() {
  return `
    var sp=document.getElementById('splashScreen');
    var lg=document.getElementById('loginScreen');
    if(sp){sp.style.display='none';}
    if(lg){lg.style.cssText='display:flex!important;opacity:1!important;';}
    document.querySelectorAll('.app-pane').forEach(function(p){p.classList.remove('active');});
  `;
}
function navPane(id) {
  return `
    var sp=document.getElementById('splashScreen');
    var lg=document.getElementById('loginScreen');
    if(sp)sp.style.display='none';
    if(lg)lg.style.display='none';
    document.querySelectorAll('.app-pane').forEach(function(p){p.classList.remove('active');});
    var el=document.getElementById('${id}');
    if(el)el.classList.add('active');
    document.querySelectorAll('.screens').forEach(function(s){s.style.display='none';});
  `;
}
function navChat(viewId) {
  return `
    var sp=document.getElementById('splashScreen');
    var lg=document.getElementById('loginScreen');
    if(sp)sp.style.display='none';
    if(lg)lg.style.display='none';
    document.querySelectorAll('.app-pane').forEach(function(p){p.classList.remove('active');});
    document.querySelectorAll('.screens').forEach(function(s){s.style.cssText='display:block!important;';});
    document.querySelectorAll('.screen-view').forEach(function(v){
      v.classList.remove('active');
      v.style.display='none';
    });
    var v=document.getElementById('${viewId}');
    if(v){
      v.style.display='flex';
      v.classList.add('active');
      v.classList.remove('hide-left','hide-right');
    }
  `;
}

/* Build screen list UI */
var ul = document.getElementById('screenList');
var dots = [];
var checks = [];
SCREENS.forEach(function(s) {
  var li = document.createElement('li');
  var dot = document.createElement('span');
  dot.className = 'dot';
  var name = document.createElement('span');
  name.className = 'screen-name';
  name.textContent = s.name;
  var chk = document.createElement('span');
  chk.className = 'check';
  chk.textContent = '✓';
  li.appendChild(dot);
  li.appendChild(name);
  li.appendChild(chk);
  ul.appendChild(li);
  dots.push(dot);
  checks.push(chk);
});

function sleep(ms){ return new Promise(function(r){setTimeout(r,ms);}); }
function setStatus(msg){ document.getElementById('overallStatus').textContent = msg; }

async function startCapture() {
  var btn = document.getElementById('startBtn');
  btn.disabled = true;
  setStatus('Loading app in background…');

  var iframe = document.getElementById('appFrame');
  var iwin = iframe.contentWindow;
  var idoc = iframe.contentDocument;

  /* Wait for iframe to fully initialise */
  await sleep(3000);

  /* Inject html2canvas into the iframe */
  setStatus('Loading capture engine…');
  try {
    await new Promise(function(res, rej) {
      var s = idoc.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
      s.onload = res;
      s.onerror = rej;
      idoc.head.appendChild(s);
    });
  } catch(e) {
    setStatus('❌ Failed to load capture engine. Check network connection.');
    btn.disabled = false;
    return;
  }
  await sleep(300);

  var zip = new JSZip();
  var folder = zip.folder('AskEva Screenshots');

  for (var i = 0; i < SCREENS.length; i++) {
    var s = SCREENS[i];
    dots[i].className = 'dot active';
    setStatus('Capturing ' + (i+1) + '/' + SCREENS.length + ': ' + s.name + '…');

    try {
      iwin.eval(s.nav);
      await sleep(800);

      /* Capture the device screen element */
      var el = idoc.getElementById('screen') || idoc.querySelector('.device-screen') || idoc.body;

      var canvas = await iwin.html2canvas(el, {
        scale: 2,
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#F6F8F5',
        logging: false,
        width: el.offsetWidth || 390,
        height: el.offsetHeight || 844,
      });

      /* Draw screen name label at bottom */
      var ctx = canvas.getContext('2d');
      var lh = 56;
      var grd = ctx.createLinearGradient(0, canvas.height - lh, 0, canvas.height);
      grd.addColorStop(0, 'rgba(21,35,26,0)');
      grd.addColorStop(1, 'rgba(21,35,26,0.88)');
      ctx.fillStyle = grd;
      ctx.fillRect(0, canvas.height - lh, canvas.width, lh);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 22px "Plus Jakarta Sans", system-ui, sans-serif';
      ctx.textBaseline = 'middle';
      ctx.fillText(s.name, 20, canvas.height - lh / 2 + 2);

      var blob = await new Promise(function(res){ canvas.toBlob(res, 'image/png'); });
      folder.file(s.name + '.png', blob);

      dots[i].className = 'dot done';
      checks[i].style.opacity = '1';
    } catch(err) {
      console.error(s.name, err);
      dots[i].className = 'dot error';
    }
  }

  setStatus('Packaging ZIP…');
  var zipBlob = await zip.generateAsync({ type: 'blob' });

  /* Trigger download */
  var a = document.createElement('a');
  a.href = URL.createObjectURL(zipBlob);
  a.download = 'AskEva Screenshots.zip';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  setStatus('✅ Done! ZIP is downloading to your device.');
  btn.textContent = '⬇ Download ZIP Again';
  btn.disabled = false;
  btn.onclick = function() {
    var a2 = document.createElement('a');
    a2.href = URL.createObjectURL(zipBlob);
    a2.download = 'AskEva Screenshots.zip';
    document.body.appendChild(a2);
    a2.click();
    document.body.removeChild(a2);
  };
}
</script>

<template id="__bundler_thumbnail" data-bg-color="#3CC23F">
  <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
    <rect width="120" height="80" fill="#3CC23F"/>
    <rect x="40" y="15" width="40" height="50" rx="5" fill="white" opacity=".9"/>
    <rect x="45" y="22" width="30" height="4" rx="2" fill="#3CC23F"/>
    <rect x="45" y="30" width="20" height="3" rx="1.5" fill="#EEF1EC"/>
    <rect x="45" y="36" width="25" height="3" rx="1.5" fill="#EEF1EC"/>
    <rect x="45" y="42" width="18" height="3" rx="1.5" fill="#EEF1EC"/>
  </svg>
</template>
</body>
</html>
